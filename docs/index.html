<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jiko</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
</head>
<body style="font-family:sans-serif;padding:16px">
  <h2>Link your wallet to Jiko</h2>
  <div id="ton-connect"></div>
  <p id="status">Not connected</p>
  <button id="send" style="display:none;padding:10px 16px">Save to Jiko bot</button>
  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) tg.ready();
    let current = null;
    const ui = new TON_CONNECT_UI.TonConnectUI({
      manifestUrl: 'https://raw.githubusercontent.com/h30h30/jiko-g2/main/docs/tonconnect-manifest-v2.json',
      buttonRootId: 'ton-connect'
    });
    ui.onStatusChange(wallet => {
      const s = document.getElementById('status');
      const b = document.getElementById('send');
      if (!wallet) { s.textContent = 'Not connected'; current = null; b.style.display = 'none'; return; }
      const addr = TON_CONNECT_UI.toUserFriendlyAddress(wallet.account.address);
      current = { address: addr, chain: wallet.account.chain };
      s.textContent = 'Connected: ' + addr + ' | chain: ' + wallet.account.chain;
      if (tg && tg.initData) b.style.display = 'inline-block';
    });
    document.getElementById('send').onclick = () => {
      if (current && tg) tg.sendData(JSON.stringify(current));
    };
  </script>
</body>
</html>
