<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Jiko · Link Wallet</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@tonconnect/ui@2/dist/tonconnect-ui.min.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #16161a);
      --card: var(--tg-theme-secondary-bg-color, #232329);
      --text: var(--tg-theme-text-color, #f4f4f6);
      --hint: var(--tg-theme-hint-color, #9ca3af);
      --btn: var(--tg-theme-button-color, #10b981);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 360px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
    }
    .logo { font-size: 32px; margin-bottom: 6px; }
    h2 { margin: 0 0 6px; font-size: 20px; font-weight: 700; }
    .sub { margin: 0 0 18px; font-size: 13px; color: var(--hint); line-height: 1.5; }
    .pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.4px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      margin-bottom: 16px;
    }
    #ton-connect {
      display: flex;
      justify-content: center;
      margin: 12px 0 18px;
    }
    .status-box {
      background: rgba(0, 0, 0, 0.18);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      font-size: 13px;
      color: var(--hint);
      word-break: break-all;
      margin-bottom: 16px;
    }
    .status-box.ok { color: #34d399; border-color: rgba(52, 211, 153, 0.35); }
    .status-box.warn { color: #f87171; border-color: rgba(248, 113, 113, 0.4); }
    button#send {
      width: 100%;
      padding: 14px 16px;
      border: none;
      border-radius: 12px;
      background: var(--btn);
      color: var(--btn-text);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }
    button#send:disabled { opacity: 0.45; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🐦</div>
    <h2>Link Wallet to Jiko</h2>
    <div class="pill">TON TESTNET ONLY</div>
    <p class="sub">Connect your TON testnet wallet to send and receive voice tips on Even G2 glasses.</p>
    <div id="ton-connect"></div>
    <div id="status" class="status-box">No wallet connected yet</div>
    <button id="send">Save Wallet to Jiko</button>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    let current = null;
    const statusEl = document.getElementById('status');
    const sendBtn = document.getElementById('send');
    const shortAddr = a => a.slice(0, 6) + '…' + a.slice(-6);

    const ui = new TON_CONNECT_UI.TonConnectUI({
      manifestUrl: 'https://raw.githubusercontent.com/h30h30/jiko-g2/main/docs/tonconnect-manifest-v2.json',
      buttonRootId: 'ton-connect'
    });

    ui.onStatusChange(wallet => {
      if (!wallet) {
        current = null;
        statusEl.className = 'status-box';
        statusEl.textContent = 'No wallet connected yet';
        sendBtn.style.display = 'none';
        return;
      }

      const addr = TON_CONNECT_UI.toUserFriendlyAddress(wallet.account.address);
      const isTestnet = String(wallet.account.chain) === '-3';

      if (!isTestnet) {
        current = null;
        statusEl.className = 'status-box warn';
        statusEl.textContent = '⚠️ Mainnet wallet detected. Please disconnect and connect a TON Testnet wallet instead.';
        sendBtn.style.display = 'none';
        return;
      }

      current = { address: addr, chain: wallet.account.chain };
      statusEl.className = 'status-box ok';
      statusEl.textContent = 'Connected (Testnet): ' + shortAddr(addr);
      sendBtn.style.display = 'block';
    });

    sendBtn.onclick = () => {
      if (current && tg) tg.sendData(JSON.stringify(current));
    };
  </script>
</body>
</html>
