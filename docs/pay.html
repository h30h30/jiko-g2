<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jiko Pay</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
</head>
<body style="font-family:sans-serif;padding:16px">
  <h2>Confirm payment</h2>
  <div id="ton-connect"></div>
  <p id="info"></p>
  <button id="pay" disabled style="padding:10px 16px">Send</button>
  <p id="result"></p>
  <script>
    const p = new URLSearchParams(location.search);
    const to = p.get('to');
    const amount = Number(p.get('amount'));
    const name = p.get('name') || '';
    const rid = p.get('r') || '';
    const exp = Number(p.get('exp')) || 0;
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) tg.ready();

    const info = document.getElementById('info');
    const out = document.getElementById('result');
    const btn = document.getElementById('pay');
    const now = () => Math.floor(Date.now() / 1000);
    let used = false;
    try { used = localStorage.getItem('used:' + rid) === '1'; } catch (e) {}

    info.textContent = 'Send ' + amount + ' GRAM to @' + name + ' (testnet)';
    const invalid = () => !rid || !exp || !to || !(amount > 0);
    const locked = () => invalid() || used || now() > exp;
    if (invalid()) out.textContent = 'Invalid request link.';
    else if (used) out.textContent = 'This request was already used.';
    else if (now() > exp) out.textContent = 'This request expired. Ask the bot for a new one.';

    const ui = new TON_CONNECT_UI.TonConnectUI({
      manifestUrl: 'https://raw.githubusercontent.com/h30h30/jiko-g2/main/docs/tonconnect-manifest-v2.json',
      buttonRootId: 'ton-connect'
    });
    ui.onStatusChange(w => { btn.disabled = !w || locked(); });

    btn.onclick = async () => {
      if (locked()) return;
      btn.disabled = true;
      try {
        await ui.sendTransaction({
          validUntil: exp,
          network: '-3',
          messages: [{ address: to, amount: String(Math.round(amount * 1e9)) }]
        });
        try { localStorage.setItem('used:' + rid, '1'); } catch (e) {}
        used = true;
        out.textContent = 'Sent ✅ Check your wallet.';
      } catch (e) {
        out.textContent = 'Cancelled or failed: ' + (e.message || e);
        btn.disabled = locked();
      }
    };
  </script>
</body>
</html>
