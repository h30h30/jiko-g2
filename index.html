<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>Jiko</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #232323;
        color: #E5E5E5;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
      }
      #app {
        display: flex;
        height: 100%;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        width: 100%;
        max-width: 320px;
        background: #2C2C2C;
        border: 1px solid #3D3D3D;
        border-radius: 14px;
        padding: 20px;
        box-sizing: border-box;
        text-align: center;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 20px;
        font-weight: 600;
      }
      .sub {
        margin: 0 0 16px;
        color: #A3A3A3;
        font-size: 13px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid #4A4A4A;
        background: #1B1B1B;
        color: #FFFFFF;
        font-size: 18px;
        letter-spacing: 4px;
        text-align: center;
        margin-bottom: 10px;
      }
      button {
        width: 100%;
        padding: 11px 14px;
        border: none;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .primary {
        background: #34D399;
        color: #111111;
      }
      .secondary {
        background: #3A3A3A;
        color: #E5E5E5;
        margin-top: 12px;
      }
      .badge {
        background: #1B1B1B;
        border: 1px solid #3D3D3D;
        border-radius: 10px;
        padding: 10px;
        margin: 12px 0;
        font-size: 13px;
      }
      .msg {
        margin: 10px 0 0;
        font-size: 13px;
        color: #F87171;
        min-height: 18px;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="card">
        <h1>Jiko</h1>

        <div id="pair-view">
          <p class="sub">Send <b>/pair</b> to the Jiko bot in Telegram, then enter your 6-digit code.</p>
          <input id="code-input" type="text" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="off" />
          <button id="pair-btn" class="primary">Pair glasses</button>
          <p id="pair-msg" class="msg"></p>
        </div>

        <div id="paired-view" class="hidden">
          <p class="sub">Connected to Even G2 glasses.</p>
          <div id="user-info" class="badge"></div>
          <p class="sub" style="margin-bottom: 0;">Check the glasses display and tap to talk.</p>
          <button id="unpair-btn" class="secondary">Unpair</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
